name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get plugin metadata
        id: meta
        run: |
          PLUGIN_SLUG=$(basename "$(pwd)")
          VERSION="${GITHUB_REF#refs/tags/}"
          # ディレクトリ名と PHP ファイル名が大文字小文字で異なる場合に対応
          # ルートにある "Plugin Name:" ヘッダーを持つ PHP ファイルをメインファイルとする
          PLUGIN_FILE=$(grep -l "Plugin Name:" *.php 2>/dev/null | head -1)
          echo "slug=${PLUGIN_SLUG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "file=${PLUGIN_FILE}" >> "$GITHUB_OUTPUT"

      - name: Verify version in plugin header
        env:
          PLUGIN_FILE: ${{ steps.meta.outputs.file }}
          EXPECTED_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          HEADER_VERSION=$(grep -oP 'Version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' "${PLUGIN_FILE}")
          if [ "$HEADER_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Tag version ($EXPECTED_VERSION) does not match plugin header version ($HEADER_VERSION)"
            exit 1
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - run: composer install --no-dev --no-interaction --optimize-autoloader

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Create plugin zip
        env:
          PLUGIN_SLUG: ${{ steps.meta.outputs.slug }}
          PLUGIN_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.husky' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='tests' \
            --exclude='src' \
            --exclude='bin' \
            --exclude='.wp-env.json' \
            --exclude='.wp-env.override.json' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='phpcs.xml.dist' \
            --exclude='phpunit.xml.dist' \
            --exclude='playwright.config.ts' \
            --exclude='.gitignore' \
            --exclude='debug.log' \
            --exclude='db.sql' \
            ./ "${PLUGIN_SLUG}/"
          zip -r "${PLUGIN_SLUG}-${PLUGIN_VERSION}.zip" "${PLUGIN_SLUG}/"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.meta.outputs.slug }}-${{ steps.meta.outputs.version }}.zip
          generate_release_notes: true
